{% extends 'base.html' %}{% block content %}<div class="row g-3"><div class="col-lg-4"><div class="card shadow-sm"><div class="card-header fw-bold">Assign Committee</div><div class="card-body"><form method="post"><div class="mb-3"><label class="form-label">Document</label><select name="check_id" class="form-select" required>{% for c in checks %}<option value="{{ c.id }}">#{{ c.id }} - {{ c.original_filename }} ({{ c.owner.full_name }})</option>{% endfor %}</select></div><div class="mb-3"><label class="form-label">Committee</label><select name="committee_user_id" class="form-select" required>{% for c in committees %}<option value="{{ c.id }}">{{ c.full_name }} - {{ c.email }}</option>{% endfor %}</select></div><button class="btn btn-primary w-100">Assign</button></form></div></div></div><div class="col-lg-8"><div class="card shadow-sm"><div class="card-header fw-bold">Assignments</div><div class="card-body table-responsive"><table class="table align-middle"><thead><tr><th>Document</th><th>Committee</th><th>Status</th><th></th></tr></thead><tbody>{% for a in assignments %}<tr><td>#{{ a.check.id }} - {{ a.check.original_filename }}</td><td>{{ a.committee.full_name }}</td><td>{{ 'Active' if a.is_active else 'Inactive' }}</td><td><form method="post" action="{{ url_for('toggle_assignment', assignment_id=a.id) }}"><button class="btn btn-sm btn-warning">Toggle</button></form></td></tr>{% endfor %}</tbody></table></div></div></div></div>{% endblock %}
