{% extends 'base.html' %}{% block content %}<div class="card shadow-sm"><div class="card-header fw-bold">Audit Logs</div><div class="card-body table-responsive"><table class="table align-middle"><thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Target</th><th>Detail</th></tr></thead><tbody>{% for log in logs %}<tr><td>{{ log.created_at }}</td><td>{{ log.actor_email }}</td><td>{{ log.action }}</td><td>{{ log.target_type }} / {{ log.target_id }}</td><td class="small">{{ log.detail }}</td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
