{% extends 'base.html' %}{% block content %}<div class="row g-3"><div class="col-lg-4"><div class="card shadow-sm"><div class="card-header fw-bold">Add Item - {{ standard.code }}</div><div class="card-body"><form method="post"><div class="mb-2"><input name="item_code" class="form-control" placeholder="Item code" required></div><div class="mb-2"><input name="category" class="form-control" placeholder="Category"></div><div class="mb-2"><textarea name="title" rows="3" class="form-control" placeholder="Title" required></textarea></div><div class="mb-2"><textarea name="keywords" rows="3" class="form-control" placeholder="comma,separated,keywords" required></textarea></div><div class="mb-3"><input name="weight" type="number" step="0.1" value="1" class="form-control"></div><button class="btn btn-primary w-100">Add Item</button></form></div></div></div><div class="col-lg-8"><div class="card shadow-sm"><div class="card-header fw-bold d-flex justify-content-between"><span>Items</span><span class="small text-muted">Drag to reorder</span></div><div class="card-body"><div class="table-responsive"><table class="table align-middle"><thead><tr><th style="width:34px"></th><th>Code</th><th>Details</th><th></th></tr></thead><tbody id="sortable-items">{% for item in items %}<tr data-item-id="{{ item.id }}"><td class="drag-handle">⋮⋮</td><td>{{ item.item_code }}</td><td><form method="post" action="{{ url_for('update_standard_item', item_id=item.id) }}" class="row g-2"><div class="col-12"><input name="item_code" value="{{ item.item_code }}" class="form-control form-control-sm"></div><div class="col-12"><input name="category" value="{{ item.category or '' }}" class="form-control form-control-sm"></div><div class="col-12"><textarea name="title" rows="2" class="form-control form-control-sm">{{ item.title }}</textarea></div><div class="col-12"><textarea name="keywords" rows="2" class="form-control form-control-sm">{{ item.keywords_json|replace('[','')|replace(']','')|replace('"','') }}</textarea></div><div class="col-4"><input name="weight" type="number" step="0.1" value="{{ item.weight }}" class="form-control form-control-sm"></div><div class="col-4"><select name="is_enabled" class="form-select form-select-sm"><option value="1" {% if item.is_enabled %}selected{% endif %}>Enabled</option><option value="0" {% if not item.is_enabled %}selected{% endif %}>Disabled</option></select></div><div class="col-4 d-grid"><button class="btn btn-sm btn-primary">Save</button></div></form></td><td><form method="post" action="{{ url_for('delete_standard_item', item_id=item.id) }}" onsubmit="return confirm('Delete item?')"><button class="btn btn-sm btn-danger">Delete</button></form></td></tr>{% endfor %}</tbody></table></div><button class="btn btn-success mt-2" id="save-order-btn" data-reorder-url="{{ url_for('reorder_standard_items', standard_id=standard.id) }}">Save Drag Order</button></div></div></div></div>{% endblock %}
