services:

  mysql:
    image: mysql:8.4
    container_name: eigda-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DB}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - eigda_mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - eigda-network


  web:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: eigda-web
    init: true
    restart: unless-stopped

    env_file:
      - .env

    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      APP_HOST: 0.0.0.0
      APP_PORT: 5000
      DEBUG: "False"
      AUTO_MIGRATE: "True"

    ports:
      - "5000:5000"

    volumes:
      - ./uploads:/app/uploads
      - ./reports:/app/reports

    depends_on:
      mysql:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:5000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

    networks:
      - eigda-network


volumes:
  eigda_mysql_data:


networks:
  eigda-network:
    driver: bridge
